services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["expense-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/expense
      DB_USER: expense
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: "false"
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:80"]
    depends_on: [backend]
volumes:
  expense-data:
