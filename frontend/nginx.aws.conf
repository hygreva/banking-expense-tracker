server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
 location = /health {access_log off;return 200 'ok';add_header Content-Type text/plain;}
 # ALB sends /api/* directly to backend:8080. There is no internal proxy here.
 location /api/ {return 404;}
 location / {try_files $uri $uri/ /index.html;}
}
