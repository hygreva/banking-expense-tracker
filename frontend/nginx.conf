server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  # Preserve the trusted edge protocol on AWS, or local scheme in Compose.
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /health {access_log off;return 200 'ok';add_header Content-Type text/plain;}
 location / {try_files $uri $uri/ /index.html;}
}
