AWSTemplateFormatVersion: '2010-09-09'
Description: Container registries for banking demo
Resources:
  Backend:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
  Frontend:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
Outputs:
  BackendRepository:
    Value:
      Fn::GetAtt:
      - Backend
      - RepositoryUri
  FrontendRepository:
    Value:
      Fn::GetAtt:
      - Frontend
      - RepositoryUri
